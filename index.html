<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Tracker by KSU</title>
<link id="favicon" rel="icon" type="image/jpeg" href="">
<style>
  :root{
    --navy:#0B1E3D; --navy2:#162D57; --blue:#2F6FED; --blue-light:#EAF1FF;
    --bg:#F3F5F9; --card:#FFFFFF; --ink:#1C2536; --ink-soft:#5B6473; --hair:#E2E6EE;
    --green:#2E9E63; --green-d:#1F7A49; --green-bg:#E7F5EE;
    --red:#D64545; --red-d:#B02F2F; --red-bg:#FBEAEA;
    --orange:#F5A623; --orange-d:#9A5B00; --orange-bg:#FEF3DF;
    --grey:#8A93A1; --grey-bg:#EEF0F4;
  }
  *{ box-sizing:border-box; }
  .hidden{ display:none !important; }
  body{
    margin:0; color:var(--ink); background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button{ font-family:inherit; }

  /* ================= LOGIN ================= */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 20px 0; background:linear-gradient(180deg, var(--navy) 0%, var(--navy2) 50%, var(--navy) 100%);
  }
  .login-wrap{ width:100%; max-width:400px; text-align:center; margin:auto 0; }
  .logo-tile{
    width:132px; height:132px; border-radius:28px; background:#fff; padding:6px; object-fit:cover;
    box-shadow:0 16px 34px rgba(0,0,0,.38);
  }
  .login-card{
    margin-top:24px; text-align:left; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:22px 20px;
  }
  .login-card h2{ color:#fff; font-size:16px; margin:0 0 16px; }
  .field{ margin-bottom:15px; }
  .field-label{
    display:block; color:rgba(255,255,255,.58); font-size:11px; font-weight:700;
    letter-spacing:.6px; text-transform:uppercase; margin-bottom:6px;
  }
  .login-card input[type="text"], .login-card input[type="date"], .login-card select{
    width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); border-radius:10px;
    padding:12px 13px; font-size:15px; color:#fff; outline:none;
  }
  .login-card select option{ background:#fff; color:#111; }
  .login-card input::placeholder{ color:rgba(255,255,255,.35); }
  .login-card input:focus, .login-card select:focus{ border-color:var(--blue); }
  .login-card input[type="date"]{ color-scheme:dark; }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ position:relative; flex:1; min-width:0; }
  .pill input{ position:absolute; opacity:0; pointer-events:none; }
  .pill span{
    display:block; text-align:center; padding:11px 10px; border-radius:10px; font-size:14px; cursor:pointer; user-select:none;
    border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.78); background:rgba(255,255,255,.05);
  }
  .pill input:checked + span{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .pill input:focus-visible + span{ outline:2px solid #fff; }
  #lgError{ color:#FF9A92; font-size:13px; margin:0 0 12px; min-height:16px; line-height:1.4; }
  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:10px; background:var(--blue); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }

  footer.credits{ text-align:center; font-size:11px; color:#8D96A5; padding:20px 14px 24px; line-height:1.5; }
  #loginScreen footer.credits{ color:rgba(255,255,255,.45); }

  /* ================= APP SHELL ================= */
  #homeScreen{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{ background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .topbar img{ width:38px; height:38px; border-radius:10px; background:#fff; padding:2px; object-fit:cover; }
  .topbar .titles{ flex:1; min-width:0; }
  .app-name{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who-line{ font-size:11.5px; color:#9FB6E8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logout-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#fff;
    border-radius:8px; padding:7px 12px; font-size:12.5px; cursor:pointer;
  }
  .tabbar{ display:flex; background:#fff; border-bottom:1px solid var(--hair); position:sticky; top:0; z-index:5; }
  .tab-btn{
    flex:1; padding:13px 6px; border:none; background:none; cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-bottom:3px solid transparent;
  }
  .tab-btn.active{ color:var(--blue); border-color:var(--blue); }
  .content{ flex:1; width:100%; max-width:640px; margin:0 auto; padding:16px 14px 8px; overflow-x:hidden; }

  .note{ text-align:center; color:var(--ink-soft); font-size:14px; padding:36px 12px; line-height:1.5; }

  /* semester select + period navigation */
  .sem-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .sem-row label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); }
  .sem-row select{
    flex:1; padding:11px 12px; border:1px solid var(--hair); border-radius:10px; background:#fff;
    font-size:15px; font-weight:600; color:var(--ink);
  }
  .period-nav{ display:flex; align-items:center; gap:10px; margin:2px 0 14px; }
  .arrow-btn{
    width:38px; height:38px; flex:none; border-radius:50%; border:1px solid var(--hair); background:#fff;
    font-size:20px; line-height:1; cursor:pointer; color:var(--ink);
  }
  .arrow-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .period-center{ flex:1; text-align:center; }
  .period-label{ font-weight:700; font-size:15px; }
  .dots{ display:flex; justify-content:center; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#C9D0DC; border:none; padding:0; cursor:pointer; }
  .dot.on{ background:var(--blue); width:20px; border-radius:6px; }

  @keyframes fromRight{ from{ opacity:0; transform:translateX(34px); } to{ opacity:1; transform:none; } }
  @keyframes fromLeft{ from{ opacity:0; transform:translateX(-34px); } to{ opacity:1; transform:none; } }
  .slide.fromRight{ animation:fromRight .26s ease; }
  .slide.fromLeft{ animation:fromLeft .26s ease; }

  .section-title{
    font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.5px; margin:18px 4px 8px;
  }

  /* progress rows */
  .row-card{
    position:relative; background:var(--card); border-radius:13px; padding:13px 15px; margin-bottom:9px;
    box-shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 18px rgba(20,30,50,.05);
  }
  .row-card.tap{ cursor:pointer; padding-right:34px; }
  .row-card.tap:active{ background:#FAFBFD; }
  .row-card .go{ position:absolute; right:13px; top:50%; transform:translateY(-50%); color:#A7B0BF; font-size:22px; }
  .row-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .row-label{ font-weight:600; font-size:14.5px; }
  .row-pct{ font-weight:700; font-size:14.5px; flex:none; }
  .row-pct.low{ color:var(--red); } .row-pct.ok{ color:var(--green-d); }
  .bar{ height:9px; border-radius:6px; background:#EDEFF3; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:6px; transition:width .3s ease; }
  .bar i.low{ background:var(--red); } .bar i.ok{ background:var(--green); }
  .chips{ display:flex; gap:7px; margin-top:9px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:700; }
  .chip.p{ background:var(--green-bg); color:var(--green-d); }
  .chip.l{ background:var(--orange-bg); color:var(--orange-d); }
  .chip.a{ background:var(--red-bg); color:var(--red-d); }
  .chip.c{ background:var(--blue-light); color:#1F4FB8; }

  .back-row{
    display:inline-flex; align-items:center; gap:6px; border:none; background:none; color:var(--blue);
    font-weight:600; font-size:14px; cursor:pointer; padding:4px 0; margin-bottom:6px;
  }
  .vtitle{ font-size:19px; font-weight:700; margin:2px 0 2px; }
  .vsub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }

  /* calendar */
  .legend{ display:flex; flex-wrap:wrap; gap:6px 12px; margin:6px 2px 12px; font-size:12px; color:var(--ink-soft); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:13px; height:13px; border-radius:4px; display:inline-block; border:1px solid var(--hair); }
  .month{ background:var(--card); border-radius:13px; padding:13px 12px 14px; margin-bottom:12px;
          box-shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 18px rgba(20,30,50,.05); }
  .month-title{ font-weight:700; font-size:14.5px; margin:0 2px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:600; color:var(--ink-soft); padding-bottom:2px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px;
    font-size:13px; font-weight:600; background:#fff; border:1px solid var(--hair); color:#9AA2AF; user-select:none;
  }
  .cal-cell.empty{ border:none; background:none; }
  .cal-cell.present{ background:var(--green); border-color:var(--green); color:#fff; cursor:pointer; }
  .cal-cell.late{ background:var(--orange); border-color:var(--orange); color:#3B2500; cursor:pointer; }
  .cal-cell.absent{ background:var(--red); border-color:var(--red); color:#fff; cursor:pointer; }
  .cal-cell.claimed{ background:var(--blue); border-color:var(--blue); color:#fff; cursor:pointer; }
  .cal-cell.sel{ outline:3px solid var(--navy); outline-offset:1px; }
  .legend i.w{ background:#fff; } .legend i.g{ background:var(--green); border-color:var(--green); }
  .legend i.o{ background:var(--orange); border-color:var(--orange); } .legend i.r{ background:var(--red); border-color:var(--red); }
  .legend i.b{ background:var(--blue); border-color:var(--blue); }
  .day-info{
    position:sticky; bottom:8px; background:var(--navy); color:#fff; border-radius:12px; padding:11px 14px;
    font-size:13.5px; line-height:1.4; box-shadow:0 8px 20px rgba(11,30,61,.3);
  }

  /* class works */
  .work{
    background:var(--card); border-radius:13px; margin-bottom:9px; overflow:hidden; cursor:pointer;
    box-shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 18px rgba(20,30,50,.05);
  }
  .work-main{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 15px; }
  .work-title{ font-weight:700; font-size:14.5px; min-width:0; overflow-wrap:anywhere; }
  .work-subj{ font-size:12px; color:var(--ink-soft); margin-top:3px; font-weight:400; }
  .deadline{ flex:none; text-align:right; padding:6px 10px; border-radius:10px; font-weight:700; font-size:12.5px; line-height:1.3; }
  .deadline small{ display:block; font-weight:600; font-size:11px; opacity:.9; }
  .deadline.green{ background:var(--green-bg); color:var(--green-d); }
  .deadline.red{ background:var(--red-bg); color:var(--red-d); }
  .deadline.grey{ background:var(--grey-bg); color:var(--grey); }
  .work.passed .work-title{ color:var(--grey); }
  .work-desc{ display:none; padding:0 15px 15px; border-top:1px dashed var(--hair); }
  .work.open .work-desc{ display:block; }
  .work-desc .meta{ font-size:12.5px; color:var(--ink-soft); margin-top:11px; }
  .work-desc .text{ font-size:14.5px; line-height:1.5; margin-top:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .work-desc .text.none{ color:var(--grey); }
</style>
</head>
<body>

<!-- ================= PAGE 1: LOGIN ================= -->
<div id="loginScreen">
  <div class="login-wrap">
    <img class="logo-tile" data-logo alt="Academic Tracker">
    <form class="login-card" id="loginForm" autocomplete="off" novalidate>
      <h2>Student Login</h2>

      <div class="field">
        <span class="field-label">Admission year</span>
        <select id="lgYear"></select>
      </div>
      <div class="field">
        <span class="field-label">Course</span>
        <div class="pills">
          <label class="pill"><input type="radio" name="course" value="BBA LLB"><span>BBA LLB</span></label>
          <label class="pill"><input type="radio" name="course" value="Unitary LLB"><span>Unitary LLB</span></label>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Division</span>
        <div class="pills">
          <label class="pill"><input type="radio" name="division" value="A"><span>A</span></label>
          <label class="pill"><input type="radio" name="division" value="B"><span>B</span></label>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Roll number</span>
        <input type="text" id="lgRoll" inputmode="numeric" maxlength="3" placeholder="e.g. 23">
      </div>
      <div class="field">
        <span class="field-label">Date of birth</span>
        <input type="date" id="lgDob">
      </div>

      <p id="lgError"></p>
      <button class="btn-primary" id="lgBtn" type="submit">Login</button>
    </form>
  </div>
  <footer class="credits">Credits: KSU 2024-29 Batch Committee.<br>Developed by Ajmal Roshan</footer>
</div>

<!-- ================= PAGE 2: HOME ================= -->
<div id="homeScreen" class="hidden">
  <header class="topbar">
    <img data-logo alt="">
    <div class="titles">
      <div class="app-name" id="appName">Academic Tracker</div>
      <div class="who-line" id="whoLine"></div>
    </div>
    <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
  </header>
  <nav class="tabbar">
    <button class="tab-btn active" type="button" data-tab="attendance">Attendance</button>
    <button class="tab-btn" type="button" data-tab="works">Class Works</button>
  </nav>
  <main class="content" id="content"></main>
  <footer class="credits">Credits: KSU 2024-29 Batch Committee.<br>Developed by Ajmal Roshan</footer>
</div>

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const fmtDate = iso => { const [y, m, d] = parts(iso); return `${d} ${MONTHS[m - 1].slice(0, 3)} ${y}`; };
  const fmtDay = iso => { const [y, m, d] = parts(iso); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
  const monthName = key => { const [y, m] = key.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const groupBy = (list, fn) => { const o = {}; list.forEach(x => { const k = fn(x); (o[k] = o[k] || []).push(x); }); return o; };

  document.querySelectorAll('[data-logo]').forEach(img => { img.src = LOGO_SRC; });
  $('favicon').href = LOGO_SRC;

  // ---------- state ----------
  const S = {
    data: null, batch: null,
    tab: 'attendance',
    sems: [], sem: null, semRecords: [], months: [], claimSet: new Set(),
    period: 0,                        // 0 = whole semester, i = i-th month
    view: 'subjects',                 // 'subjects' | 'teachers' | 'calendar'
    subject: null, teacher: null,
    anim: '', calMap: {}
  };
  let HIST_OK = true;

  // ---------- API ----------
  async function api(payload) {
    if (SCRIPT_URL.includes('YOUR_DEPLOYMENT_ID')) throw new Error('This site is not connected yet. Paste your Apps Script /exec URL into SCRIPT_URL at the top of the script.');
    let res;
    try {
      res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    } catch (e) { throw new Error('Could not reach the server. Check your internet connection and try again.'); }
    let data;
    try { data = await res.json(); } catch (e) { throw new Error('The server sent an unexpected reply. Please try again later.'); }
    if (!data.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  // ---------- login ----------
  (function initLogin() {
    let opts = '<option value="">Select year</option>';
    for (let y = YEAR_FROM; y <= YEAR_TO; y++) opts += `<option value="${y}">${y}</option>`;
    $('lgYear').innerHTML = opts;
    const t = new Date();
    $('lgDob').max = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  })();
  const checked = name => { const r = document.querySelector(`input[name="${name}"]:checked`); return r ? r.value : ''; };

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('lgError'), btn = $('lgBtn');
    const year = $('lgYear').value, course = checked('course'), division = checked('division');
    const roll = parseInt($('lgRoll').value.trim(), 10), dob = $('lgDob').value;
    if (!year) return void (err.textContent = 'Select your admission year.');
    if (!course) return void (err.textContent = 'Select your course.');
    if (!division) return void (err.textContent = 'Select your division.');
    if (!roll || roll < 1) return void (err.textContent = 'Enter a valid roll number.');
    if (!dob) return void (err.textContent = 'Select your date of birth.');

    err.textContent = ''; btn.disabled = true; btn.textContent = 'Checking...';
    try {
      const data = await api({ action: 'portal', year, course, division, roll, dob });
      S.data = data;
      S.batch = { year, course, division, roll };
      enterHome();
    } catch (ex) {
      err.textContent = ex.message;
    } finally { btn.disabled = false; btn.textContent = 'Login'; }
  });

  function enterHome() {
    data_sort();
    S.tab = 'attendance'; S.view = 'subjects'; S.subject = S.teacher = null; S.period = 0; S.anim = '';
    S.claimSet = new Set(S.data.claims.map(c => c.sem + '|' + c.date));
    S.sems = [...new Set(S.data.records.map(r => r.sem))].sort((a, b) => a - b);
    S.sem = S.sems.length ? S.sems[S.sems.length - 1] : null;
    deriveSem();
    $('whoLine').textContent = `Roll ${S.batch.roll} \u00B7 ${S.batch.year} ${S.batch.course} ${S.batch.division}`;
    $('appName').textContent = S.data.name || 'Academic Tracker';
    $('loginScreen').classList.add('hidden');
    $('homeScreen').classList.remove('hidden');
    try { history.replaceState({ view: 'subjects' }, ''); } catch (e) { HIST_OK = false; }
    window.scrollTo(0, 0);
    render();
  }
  function data_sort() { S.data.records.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }

  $('logoutBtn').addEventListener('click', () => {
    S.data = null; S.batch = null;
    $('lgRoll').value = ''; $('lgDob').value = ''; $('lgError').textContent = '';
    $('homeScreen').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    window.scrollTo(0, 0);
  });

  // ---------- derived data ----------
  function deriveSem() {
    S.semRecords = S.data.records.filter(r => r.sem === S.sem);
    S.months = [...new Set(S.semRecords.map(r => r.date.slice(0, 7)))].sort();
  }
  const periodCount = () => S.months.length + 1;
  function periodRecs() {
    if (S.period === 0) return S.semRecords;
    const m = S.months[S.period - 1];
    return S.semRecords.filter(r => r.date.startsWith(m));
  }
  const periodTitle = () => S.period === 0 ? `Semester ${S.sem}` : monthName(S.months[S.period - 1]);

  /** Counts + percentage for a list of records. Claimed days are treated as present. */
  function summarize(recs) {
    const s = { p: 0, l: 0, a: 0, c: 0 };
    recs.forEach(r => {
      if (S.claimSet.has(r.sem + '|' + r.date)) s.c++;
      else if (r.status === 'P') s.p++;
      else if (r.status === 'L') s.l++;
      else s.a++;
    });
    const total = s.p + s.l + s.a + s.c;
    const credit = s.p + Math.ceil(s.l * LATE_WEIGHT) + (CLAIMS_COUNT_AS_PRESENT ? s.c : 0);
    s.pct = total ? (credit / total) * 100 : 0;
    return s;
  }

  // ---------- navigation ----------
  function go(view, subject, teacher) {
    S.view = view; S.subject = subject || null; S.teacher = teacher || null; S.anim = '';
    try { history.pushState({ view, subject: S.subject, teacher: S.teacher }, ''); } catch (e) { HIST_OK = false; }
    window.scrollTo(0, 0);
    render();
  }
  function back() {
    const st = (() => { try { return history.state; } catch (e) { return null; } })();
    if (HIST_OK && st && st.view && st.view !== 'subjects') { history.back(); return; }
    S.view = S.view === 'calendar' ? 'teachers' : 'subjects';
    if (S.view === 'subjects') { S.subject = S.teacher = null; }
    render();
  }
  window.addEventListener('popstate', e => {
    if (!S.data) return;
    const st = e.state || {};
    S.view = st.view || 'subjects'; S.subject = st.subject || null; S.teacher = st.teacher || null; S.anim = '';
    render();
  });

  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
    S.tab = b.dataset.tab; S.anim = '';
    render();
  }));

  function shiftPeriod(delta) {
    const n = Math.max(0, Math.min(periodCount() - 1, S.period + delta));
    if (n === S.period) return;
    S.anim = n > S.period ? 'fromRight' : 'fromLeft';
    S.period = n;
    render();
  }

  // ---------- rendering: shared bits ----------
  function barCard(label, s, attrs) {
    const low = s.pct < LOW_THRESHOLD;
    return `<div class="row-card ${attrs ? 'tap' : ''}" ${attrs || ''}>
      <div class="row-top"><div class="row-label">${esc(label)}</div><div class="row-pct ${low ? 'low' : 'ok'}">${s.pct.toFixed(1)}%</div></div>
      <div class="bar"><i class="${low ? 'low' : 'ok'}" style="width:${Math.min(100, s.pct).toFixed(1)}%"></i></div>
      <div class="chips">
        <span class="chip p">P ${s.p}</span><span class="chip l">L ${s.l}</span><span class="chip a">A ${s.a}</span>${s.c ? `<span class="chip c">Claimed ${s.c}</span>` : ''}
      </div>
      ${attrs ? '<div class="go">&#8250;</div>' : ''}
    </div>`;
  }

  function render() {
    if (!S.data) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
    $('content').innerHTML = S.tab === 'attendance' ? attendanceHtml() : worksHtml();
    S.anim = '';
  }

  // ---------- Attendance ----------
  function attendanceHtml() {
    if (!S.sems.length) return '<div class="note">No attendance has been recorded for you yet.</div>';
    if (S.view === 'teachers' && S.subject) return teachersHtml();
    if (S.view === 'calendar' && S.subject && S.teacher !== null) return calendarHtml();
    return subjectsHtml();
  }

  function subjectsHtml() {
    const semSelect = `<div class="sem-row"><label for="semSelect">Semester</label>
      <select id="semSelect">${S.sems.map(n => `<option value="${n}"${n === S.sem ? ' selected' : ''}>Semester ${n}</option>`).join('')}</select></div>`;

    const n = periodCount();
    let dots = '';
    for (let i = 0; i < n; i++) dots += `<button type="button" class="dot${i === S.period ? ' on' : ''}" data-act="dot" data-i="${i}" aria-label="${i === 0 ? 'Semester overview' : monthName(S.months[i - 1])}"></button>`;
    const nav = `<div class="period-nav">
      <button type="button" class="arrow-btn" data-act="prev" aria-label="Previous"${S.period === 0 ? ' disabled' : ''}>&#8249;</button>
      <div class="period-center"><div class="period-label">${esc(S.period === 0 ? 'Overall Semester ' + S.sem : monthName(S.months[S.period - 1]))}</div><div class="dots">${dots}</div></div>
      <button type="button" class="arrow-btn" data-act="next" aria-label="Next"${S.period === n - 1 ? ' disabled' : ''}>&#8250;</button>
    </div>`;

    const recs = periodRecs();
    const bySubject = groupBy(recs, r => r.subject);
    const subjects = Object.keys(bySubject).sort((a, b) => a.localeCompare(b));
    let body = barCard('Overall \u2014 ' + periodTitle(), summarize(recs)) + '<div class="section-title">Subjects</div>';
    body += subjects.length
      ? subjects.map(s => barCard(s, summarize(bySubject[s]), `data-act="subject" data-v="${esc(s)}"`)).join('')
      : '<div class="note">No classes recorded in this period.</div>';

    return semSelect + nav + `<div class="slide ${S.anim}">${body}</div>`;
  }

  function teachersHtml() {
    const recs = periodRecs().filter(r => r.subject === S.subject);
    const byTeacher = groupBy(recs, r => r.teacher);
    const teachers = Object.keys(byTeacher).sort((a, b) => a.localeCompare(b));
    return `<button type="button" class="back-row" data-act="back">&#8592; Subjects</button>
      <div class="vtitle">${esc(S.subject)}</div>
      <div class="vsub">${esc(periodTitle())}</div>
      ${barCard('Overall \u2014 ' + S.subject, summarize(recs))}
      <div class="section-title">Teachers</div>
      ${teachers.length ? teachers.map(t => barCard(t || '(Unspecified)', summarize(byTeacher[t]), `data-act="teacher" data-v="${esc(t)}"`)).join('') : '<div class="note">No classes recorded in this period.</div>'}`;
  }

  function calendarHtml() {
    const recs = periodRecs().filter(r => r.subject === S.subject && r.teacher === S.teacher);
    const calMap = {};
    recs.forEach(r => { const o = calMap[r.date] = calMap[r.date] || { p: 0, l: 0, a: 0 }; o[r.status.toLowerCase()]++; });
    S.calMap = calMap;

    const months = S.period === 0 ? S.months : [S.months[S.period - 1]];
    const grids = months.map(key => {
      const [y, m] = key.split('-').map(Number);
      const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
      let cells = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < first; i++) cells += '<div class="cal-cell empty"></div>';
      for (let d = 1; d <= days; d++) {
        const iso = `${y}-${pad(m)}-${pad(d)}`, info = calMap[iso];
        let cls = '', attr = '';
        if (info) {
          cls = S.claimSet.has(S.sem + '|' + iso) ? 'claimed' : info.a ? 'absent' : info.l ? 'late' : 'present';
          attr = ` data-act="day" data-date="${iso}"`;
        }
        cells += `<div class="cal-cell ${cls}"${attr}>${d}</div>`;
      }
      return `<div class="month"><div class="month-title">${esc(monthName(key))}</div><div class="cal-grid">${cells}</div></div>`;
    }).join('');

    return `<button type="button" class="back-row" data-act="back">&#8592; Teachers</button>
      <div class="vtitle">${esc(S.teacher || '(Unspecified)')}</div>
      <div class="vsub">${esc(S.subject)} \u00B7 ${esc(periodTitle())}</div>
      ${barCard('Attendance with this teacher', summarize(recs))}
      <div class="legend">
        <span><i class="w"></i>No class</span><span><i class="g"></i>Present</span><span><i class="o"></i>Late</span>
        <span><i class="r"></i>Absent</span><span><i class="b"></i>Claimed</span>
      </div>
      ${grids}
      <div class="day-info" id="dayInfo">Tap a coloured day to see what was recorded.</div>`;
  }

  function showDay(iso, el) {
    const info = S.calMap[iso]; if (!info) return;
    document.querySelectorAll('.cal-cell.sel').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    const bits = [];
    if (info.p) bits.push(`Present${info.p > 1 ? ' \u00D7' + info.p : ''}`);
    if (info.l) bits.push(`Late${info.l > 1 ? ' \u00D7' + info.l : ''}`);
    if (info.a) bits.push(`Absent${info.a > 1 ? ' \u00D7' + info.a : ''}`);
    const claimed = S.claimSet.has(S.sem + '|' + iso);
    $('dayInfo').textContent = `${fmtDay(iso)}: ${claimed ? 'Attendance claimed (register: ' + bits.join(', ') + ')' : bits.join(', ')}`;
  }

  // ---------- Class works ----------
  function worksHtml() {
    const today = S.data.today;
    const items = S.data.works.map(w => ({ ...w, left: w.deadline ? daysBetween(w.deadline, today) : null }));
    if (!items.length) return '<div class="note">No class works right now.</div>';

    const live = items.filter(w => w.left === null || w.left >= 0).sort((a, b) => (a.left === null) - (b.left === null) || a.left - b.left);
    const gone = items.filter(w => w.left !== null && w.left < 0).sort((a, b) => b.left - a.left);

    const tile = w => {
      let cls, cap;
      if (w.left === null) { cls = 'grey'; cap = 'No deadline'; }
      else if (w.left < 0) { cls = 'grey'; cap = 'Passed'; }
      else if (w.left >= 2) { cls = 'green'; cap = `${w.left} days left`; }
      else { cls = 'red'; cap = w.left === 0 ? 'Due today' : '1 day left'; }
      const passed = w.left !== null && w.left < 0;
      return `<div class="work${passed ? ' passed' : ''}" data-act="work">
        <div class="work-main">
          <div><div class="work-title">${esc(w.title)}</div>${w.subject ? `<div class="work-subj">${esc(w.subject)}</div>` : ''}</div>
          <div class="deadline ${cls}">${w.deadline ? esc(fmtDate(w.deadline)) : '\u2014'}<small>${cap}</small></div>
        </div>
        <div class="work-desc">
          <div class="meta">${esc(w.subject)}${w.teacher ? ' \u00B7 ' + esc(w.teacher) : ''}</div>
          <div class="text${w.description ? '' : ' none'}">${w.description ? esc(w.description) : 'No description provided.'}</div>
        </div>
      </div>`;
    };
    return live.map(tile).join('') + gone.map(tile).join('');
  }

  // ---------- events (delegated) ----------
  $('content').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    switch (el.dataset.act) {
      case 'prev': shiftPeriod(-1); break;
      case 'next': shiftPeriod(1); break;
      case 'dot': { const i = +el.dataset.i; shiftPeriod(i - S.period); break; }
      case 'subject': go('teachers', el.dataset.v); break;
      case 'teacher': go('calendar', S.subject, el.dataset.v); break;
      case 'back': back(); break;
      case 'day': showDay(el.dataset.date, el); break;
      case 'work': el.classList.toggle('open'); break;
    }
  });
  $('content').addEventListener('change', e => {
    if (e.target.id === 'semSelect') {
      S.sem = +e.target.value; S.period = 0; S.anim = '';
      deriveSem(); render();
    }
  });

  // swipe sideways to move between the semester overview and each month
  (function () {
    let x0 = 0, y0 = 0;
    const c = $('content');
    c.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY; }, { passive: true });
    c.addEventListener('touchend', e => {
      if (!S.data || S.tab !== 'attendance' || S.view !== 'subjects' || !S.sems.length) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      shiftPeriod(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();
</script>
</body>
</html>
